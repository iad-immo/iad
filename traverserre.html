<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Parcelles en vente - Bois &amp; Fermage</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --col-bois: #4caf50;
    --col-fermage: #ffd54f;
    --col-both: #ba68c8;
    --col-libre: #4fc3f7;
    --bg: #f7f5f0;
    --panel-bg: #ffffff;
    --text: #26241f;
    --muted: #6b675f;
    --border: #e2ded3;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
  #app { display:flex; flex-direction:column; height:100%; }
  header { padding: 14px 20px; background: #1f2d24; color: #f4f1ea; }
  header h1 { margin:0; font-size: 1.25rem; font-weight:600; }
  header p { margin: 4px 0 0; font-size: 0.85rem; color: #cfd8cf; }
  #main { flex: 1; display:flex; min-height:0; }
  #map { flex: 1; height: 100%; background:#111; }
  #sidebar {
    width: 280px;
    background: var(--panel-bg);
    border-left: 1px solid var(--border);
    padding: 16px;
    overflow-y:auto;
    font-size: 0.85rem;
  }
  #sidebar h2 { font-size: 0.95rem; margin: 0 0 10px; }
  .legend-item { display:flex; align-items:center; gap:8px; margin-bottom: 8px; cursor:pointer; padding:4px 6px; border-radius:6px; transition: background .15s; }
  .legend-item:hover { background: #f1efe8; }
  .legend-item.disabled { opacity: 0.35; }
  .swatch { width:16px; height:16px; border-radius:4px; flex-shrink:0; border: 1px solid rgba(0,0,0,0.3); }
  .stats { margin-top: 4px; margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size:0.8rem;}
  hr { border:none; border-top:1px solid var(--border); margin: 14px 0; }
  .totals { font-size: 0.82rem; color: var(--muted); line-height:1.5; }
  .totals b { color: var(--text); }
  .leaflet-popup-content-wrapper { border-radius:8px; }
  .popup-title { font-weight:700; font-size:0.95rem; margin-bottom:4px; }
  .popup-row { display:flex; justify-content:space-between; gap:12px; font-size:0.82rem; padding:1px 0; }
  .popup-row span:first-child { color:#6b675f; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:0.72rem; color:#111; margin-top:4px; font-weight:600;}
  .parcel-label {
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 4px;
    border-radius: 3px;
    border: none;
    box-shadow: none;
    white-space: nowrap;
  }
  .parcel-label::before { display:none; }
  .house-label {
    background: #d84315;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .house-label::before { display:none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Parcelles en vente</h1>
    <p>Communes de Traversères, Haulies, Boucagnères &amp; Orbessan (Gers) — fond satellite, bois et fermage distingués</p>
  </header>
  <div id="main">
    <div id="map"></div>
    <div id="sidebar">
      <h2>Légende</h2>
      <div id="legend"></div>
      <hr>
      <div class="totals" id="totals"></div>
      <hr>
      <div class="totals">Cliquez sur une parcelle pour le détail. Cliquez sur la légende pour filtrer.</div>
    </div>
  </div>
</div>

  bois:            { label: 'Bois',                color: '#4caf50' },
  fermage:         { label: 'Fermage',              color: '#ffd54f' },

const active = { bois:true, fermage:true, bois_et_fermage:true, libre:true };

function fmt(n){
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Math.round(n).toLocaleString('fr-FR') + ' m²';
}

function styleFor(cat){
  const c = CATS[cat].color;
  return { color: '#ffffff', weight: 1.5, fillColor: c, fillOpacity: 0.4 };
}

let geoLayer;

function popupHtml(p){
  const catInfo = CATS[p.categorie];
  let rows = `
    <div class="popup-row"><span>Commune</span><b>${p.commune}</b></div>
    <div class="popup-row"><span>Section</span><b>${p.section}</b></div>
    <div class="popup-row"><span>Contenance (vente)</span><b>${fmt(p.contenance_vente_m2)}</b></div>`;
  if (p.categorie === 'fermage' || p.categorie === 'bois_et_fermage') {
    rows += `<div class="popup-row"><span>Surface en fermage</span><b>${fmt(p.fermage_surface_m2)}${p.fermage_partiel ? ' (partiel)' : ''}</b></div>`;
  }
  if (p.categorie === 'bois' || p.categorie === 'bois_et_fermage') {
    rows += `<div class="popup-row"><span>Surface en bois</span><b>${fmt(p.bois_surface_m2)}</b></div>`;
  }
  return `<div class="popup-title">Parcelle ${p.parcelle}</div>${rows}
    <span class="tag" style="background:${catInfo.color}">${catInfo.label}</span>`;
}

function centroid(geometry){
  // simple polygon centroid approximation (average of ring points)
  const ring = geometry.coordinates[0];
  let x=0, y=0;
  ring.forEach(([lon,lat]) => { x += lon; y += lat; });
  return [y/ring.length, x/ring.length];
}

  const filtered = {
    type: 'FeatureCollection',
    features: DATA.features.filter(f => active[f.properties.categorie])
  };
  geoLayer = L.geoJSON(filtered, {
    style: f => styleFor(f.properties.categorie),
    onEachFeature: (f, layer) => {
      layer.bindPopup(popupHtml(f.properties));
      layer.on('mouseover', () => layer.setStyle({ weight: 3, fillOpacity: 0.65 }));
      layer.on('mouseout', () => layer.setStyle(styleFor(f.properties.categorie)));

      const c = centroid(f.geometry);
      L.marker(c, {
        icon: L.divIcon({ className: 'parcel-label', html: f.properties.parcelle, iconSize: null }),
        interactive: false
      }).addTo(map);
    }
  }).addTo(map);
}

// bounds from all data (fixed extent regardless of filter), plus the house
const allLayer = L.geoJSON(DATA);
const bounds = allLayer.getBounds();
bounds.extend([HOUSE.lat, HOUSE.lon]);
map.fitBounds(bounds, { padding: [30,30] });

render();

// House marker
const houseIcon = L.divIcon({
  className: '',
  html: '<div style="font-size:28px; line-height:1; text-shadow: 0 0 4px #000, 0 0 4px #000;">🏠</div>',
  iconSize: [30,30],
  iconAnchor: [15,28]
});
L.marker([HOUSE.lat, HOUSE.lon], { icon: houseIcon })
  .addTo(map)
  .bindPopup('<div class="popup-title">Maison d\'habitation</div><div class="popup-row"><span>Lieu-dit</span><b>Mauvesin</b></div>')
  .bindTooltip('Maison', { permanent: true, direction: 'top', offset: [0,-26], className: 'house-label' });

// Legend + stats
const counts = {};
let totalSurface = {};
DATA.features.forEach(f => {
  const c = f.properties.categorie;
  counts[c] = (counts[c]||0) + 1;
  totalSurface[c] = (totalSurface[c]||0) + (f.properties.contenance_vente_m2||0);
});

const legendDiv = document.getElementById('legend');
Object.keys(CATS).forEach(cat => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<div class="swatch" style="background:${CATS[cat].color}"></div>
    <div>${CATS[cat].label}</div>
    <div class="stats">${counts[cat]||0}</div>`;
  item.addEventListener('click', () => {
    active[cat] = !active[cat];
    item.classList.toggle('disabled', !active[cat]);
    render();
  });
  legendDiv.appendChild(item);
});

const totalParcels = DATA.features.length;
const totalSurfAll = DATA.features.reduce((s,f)=>s+(f.properties.contenance_vente_m2||0),0);
document.getElementById('totals').innerHTML = `
  <div><b>${totalParcels}</b> parcelles en vente au total</div>
  <div>Surface totale : <b>${fmt(totalSurfAll)}</b></div>
`;
</script>
</body>
</html>
